name: Trigger auto deployment for backend-container-cady32

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ stage-10 ]
    paths:
    - '**'
    - '.github/workflows/backend-container-cady32-AutoDeployTrigger-b4454d16-dc08-493c-bce8-66f2a7b72e9b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.BACKENDCONTAINERCADY32_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKENDCONTAINERCADY32_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKENDCONTAINERCADY32_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: cadycontainerregitry.azurecr.io
          registryUsername: ${{ secrets.BACKENDCONTAINERCADY32_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BACKENDCONTAINERCADY32_REGISTRY_PASSWORD }}
          containerAppName: backend-container-cady32
          resourceGroup: cady8demo
          imageToBuild: cadycontainerregitry.azurecr.io/backend-container-cady32:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


